[project]
name = "gtsrb"
version = "0.1.0"
description = "Traffic sign classification on the German Traffic Sign Recognition Benchmark (GTSRB) with PyTorch"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "TonyGrif", email = "tonygriffin2000@gmail.com" }]
dependencies = ["torch>=2.5", "torchvision>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
pytorch = ">=2.5"
torchvision = ">=0.20"
matplotlib = ">=3.11.2,<4"

[tool.pixi.pypi-dependencies]
gtsrb = { path = ".", editable = true }

# CUDA-enabled PyTorch
[tool.pixi.feature.cuda]
platforms = ["linux-64"]
system-requirements = { cuda = "12" }

[tool.pixi.feature.cuda.dependencies]
pytorch-gpu = "*"
cuda-version = "12.*"

[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-cov = "*"
pre-commit = "*"

[tool.pixi.feature.dev.tasks]
lint = { cmd = "ruff check .", description = "Lint with ruff" }
lint-fix = { cmd = "ruff check --fix .", description = "Lint and auto-fix with ruff" }
format = { cmd = "ruff format .", description = "Format with ruff" }
format-check = { cmd = "ruff format --check .", description = "Check formatting" }
typecheck = { cmd = "mypy", description = "Type check with mypy" }
test = { cmd = "pytest", description = "Run the test suite" }
check = { depends-on = ["format-check", "lint", "typecheck", "test"], description = "Run all checks (CI)" }
pre-commit-install = { cmd = "pre-commit install", description = "Install git pre-commit hooks" }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
cuda = { features = ["cuda"], solve-group = "cuda" }
cuda-dev = { features = ["cuda", "dev"], solve-group = "cuda" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "ARG",      # flake8-unused-arguments
    "PL",       # pylint
    "NPY",      # numpy-specific rules
    "PERF",     # perflint
    "RUF",      # ruff-specific rules
]
ignore = [
    "PLR0913",  # too many arguments: common for training/config functions
    "N812",     # `import torch.nn.functional as F` is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values are fine in assertions

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["torchvision", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--cov=gtsrb", "--cov-report=term-missing"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["gtsrb"]
